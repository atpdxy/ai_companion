name: checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: companion, POSTGRES_PASSWORD: testing-only-password, POSTGRES_DB: companion }
        ports: ["25432:5432"]
        options: --health-cmd "pg_isready -U companion" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://companion:testing-only-password@localhost:25432/companion?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.27.x', cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: pip install -r services/ai/requirements-dev.lock && pip install --no-deps -e ./services/ai
      - run: python scripts/generate_contracts.py && ruff check services/ai/src services/ai/tests && ruff format --check services/ai/src services/ai/tests && mypy services/ai/src && pytest services/ai/tests -q
      - run: test -z "$(gofmt -l cmd internal migrations)" && go vet ./... && go test -race ./...
        working-directory: services/api
      - uses: golangci/golangci-lint-action@v8
        with: { working-directory: services/api, version: latest }
      - run: npm ci && npm run lint && npm run format:check && npm run build
        working-directory: apps/web
